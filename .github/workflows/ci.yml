name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # systemd in the host container is simplest under rootful Podman.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-php sh -c 'systemctl list-units --state=running --no-legend "php*-fpm.service" | grep fpm'
      # app.example.test is Apache in front of the app pool's socket. The
      # page prints PHP's version and " mysqli" when the extension loads.
      - name: Fetch a PHP page through Apache, and check the pool and extensions
        run: |
          sudo podman exec -i circuit-php sh -eu <<'EOF'
          id www-data >/dev/null 2>&1 && web=www-data || web=apache
          for sock in /run/php/app.sock /run/php-fpm/app.sock; do [ -e "$sock" ] && break; done
          [ -S "$sock" ]
          stat -c '%U:%G %a %n' "$sock"
          [ "$(stat -c %U:%G "$sock")" = "$web:$web" ]
          out=$(curl -sSf -H 'Host: app.example.test' localhost:8080/)
          echo "$out"
          echo "$out" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+ mysqli'
          if curl -sSfI -H 'Host: app.example.test' localhost:8080/ | grep -qi '^x-powered-by'; then exit 1; fi
          [ "$(php -r 'echo ini_get("memory_limit");')" = 256M ]
          for e in mysqli pdo_mysql gd intl mbstring zip curl xml; do
            php -r "exit(extension_loaded('$e') ? 0 : 1);" || { echo "$e isn't loaded" >&2; exit 1; }
          done
          composer --version
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
